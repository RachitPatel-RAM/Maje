<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffed4e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="url(#bgGradient)"/>
  
  <!-- AI Brain Icon -->
  <g transform="translate(200, 125)">
    <!-- Brain outline -->
    <path d="M-40,-30 C-50,-30 -55,-20 -55,-10 C-55,0 -50,10 -40,15 C-30,20 -20,25 0,25 C20,25 30,20 40,15 C50,10 55,0 55,-10 C55,-20 50,-30 40,-30 C30,-35 20,-35 10,-35 C0,-35 -10,-35 -20,-35 C-30,-35 -40,-30 -40,-30 Z" 
          fill="none" stroke="url(#iconGradient)" stroke-width="3"/>
    
    <!-- Neural network nodes -->
    <circle cx="-25" cy="-10" r="4" fill="url(#iconGradient)"/>
    <circle cx="0" cy="-15" r="4" fill="url(#iconGradient)"/>
    <circle cx="25" cy="-10" r="4" fill="url(#iconGradient)"/>
    <circle cx="-15" cy="5" r="4" fill="url(#iconGradient)"/>
    <circle cx="15" cy="5" r="4" fill="url(#iconGradient)"/>
    
    <!-- Neural connections -->
    <line x1="-25" y1="-10" x2="0" y2="-15" stroke="url(#iconGradient)" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="-15" x2="25" y2="-10" stroke="url(#iconGradient)" stroke-width="2" opacity="0.7"/>
    <line x1="-25" y1="-10" x2="-15" y2="5" stroke="url(#iconGradient)" stroke-width="2" opacity="0.7"/>
    <line x1="25" y1="-10" x2="15" y2="5" stroke="url(#iconGradient)" stroke-width="2" opacity="0.7"/>
    <line x1="-15" y1="5" x2="15" y2="5" stroke="url(#iconGradient)" stroke-width="2" opacity="0.7"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="200" text-anchor="middle" fill="#ffd700" font-family="Arial, sans-serif" font-size="24" font-weight="bold">AI Solution</text>
</svg>