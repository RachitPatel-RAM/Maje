<svg width="350" height="200" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="350" height="200" fill="url(#bgGradient)"/>
  
  <!-- Branding Elements -->
  <g transform="translate(175, 100)">
    <!-- Logo placeholder -->
    <circle cx="0" cy="-20" r="25" fill="none" stroke="white" stroke-width="3"/>
    <circle cx="0" cy="-20" r="15" fill="white" opacity="0.3"/>
    <rect x="-5" y="-25" width="10" height="10" fill="white"/>
    
    <!-- Business cards -->
    <rect x="-40" y="10" width="30" height="20" rx="2" fill="white" opacity="0.8"/>
    <rect x="-35" y="15" width="20" height="2" fill="url(#bgGradient)"/>
    <rect x="-35" y="20" width="15" height="1" fill="url(#bgGradient)" opacity="0.7"/>
    
    <rect x="10" y="10" width="30" height="20" rx="2" fill="white" opacity="0.8"/>
    <rect x="15" y="15" width="20" height="2" fill="url(#bgGradient)"/>
    <rect x="15" y="20" width="15" height="1" fill="url(#bgGradient)" opacity="0.7"/>
    
    <!-- Color palette -->
    <circle cx="-50" cy="-20" r="8" fill="white"/>
    <circle cx="-35" cy="-20" r="8" fill="white" opacity="0.7"/>
    <circle cx="-20" cy="-20" r="8" fill="white" opacity="0.5"/>
  </g>
  
  <!-- Title -->
  <text x="175" y="170" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Branding</text>
</svg>