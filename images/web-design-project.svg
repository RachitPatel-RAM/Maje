<svg width="350" height="200" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="350" height="200" fill="url(#bgGradient)"/>
  
  <!-- Design Elements -->
  <g transform="translate(175, 100)">
    <!-- Monitor/Screen -->
    <rect x="-60" y="-40" width="120" height="70" rx="5" fill="none" stroke="white" stroke-width="3"/>
    <!-- Screen content -->
    <rect x="-55" y="-35" width="110" height="60" rx="3" fill="white" opacity="0.2"/>
    <!-- Design elements -->
    <rect x="-50" y="-30" width="30" height="4" fill="white" opacity="0.8"/>
    <rect x="-50" y="-20" width="20" height="20" rx="2" fill="white" opacity="0.6"/>
    <rect x="-25" y="-20" width="60" height="3" fill="white" opacity="0.8"/>
    <rect x="-25" y="-14" width="50" height="3" fill="white" opacity="0.6"/>
    <rect x="-25" y="-8" width="40" height="3" fill="white" opacity="0.6"/>
    <rect x="-50" y="5" width="100" height="3" fill="white" opacity="0.6"/>
    <rect x="-50" y="12" width="80" height="3" fill="white" opacity="0.6"/>
    <!-- Stand -->
    <rect x="-10" y="30" width="20" height="15" fill="white" opacity="0.8"/>
    <rect x="-25" y="45" width="50" height="5" fill="white" opacity="0.8"/>
  </g>
  
  <!-- Title -->
  <text x="175" y="180" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Web Design</text>
</svg>