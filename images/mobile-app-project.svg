<svg width="350" height="200" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="350" height="200" fill="url(#bgGradient)"/>
  
  <!-- Mobile Phone -->
  <g transform="translate(175, 100)">
    <!-- Phone outline -->
    <rect x="-25" y="-50" width="50" height="100" rx="10" fill="none" stroke="white" stroke-width="3"/>
    <!-- Screen -->
    <rect x="-20" y="-40" width="40" height="70" rx="3" fill="white" opacity="0.2"/>
    <!-- App interface -->
    <rect x="-15" y="-35" width="30" height="5" fill="white" opacity="0.8"/>
    <rect x="-15" y="-25" width="12" height="12" rx="2" fill="white" opacity="0.8"/>
    <rect x="0" y="-25" width="12" height="12" rx="2" fill="white" opacity="0.8"/>
    <rect x="-15" y="-8" width="25" height="3" fill="white" opacity="0.6"/>
    <rect x="-15" y="-2" width="20" height="3" fill="white" opacity="0.6"/>
    <rect x="-15" y="4" width="30" height="3" fill="white" opacity="0.6"/>
    <!-- Home button -->
    <circle cx="0" cy="40" r="4" fill="none" stroke="white" stroke-width="2"/>
  </g>
  
  <!-- Title -->
  <text x="175" y="170" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Mobile App</text>
</svg>