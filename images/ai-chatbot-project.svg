<svg width="350" height="200" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="350" height="200" fill="url(#bgGradient)"/>
  
  <!-- Chatbot Interface -->
  <g transform="translate(175, 100)">
    <!-- Chat window -->
    <rect x="-60" y="-50" width="120" height="80" rx="8" fill="none" stroke="white" stroke-width="3"/>
    <!-- Header -->
    <rect x="-60" y="-50" width="120" height="15" rx="8" fill="white" opacity="0.3"/>
    <!-- Bot avatar -->
    <circle cx="-45" cy="-42" r="5" fill="white"/>
    <!-- Chat bubbles -->
    <rect x="-50" y="-25" width="40" height="8" rx="4" fill="white" opacity="0.8"/>
    <rect x="10" y="-10" width="35" height="8" rx="4" fill="white" opacity="0.6"/>
    <rect x="-45" y="5" width="50" height="8" rx="4" fill="white" opacity="0.8"/>
    <!-- Typing indicator -->
    <circle cx="-40" cy="20" r="2" fill="white" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-32" cy="20" r="2" fill="white" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.8;0.6" dur="1s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="-24" cy="20" r="2" fill="white" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
  </g>
  
  <!-- Title -->
  <text x="175" y="170" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">AI Chatbot</text>
</svg>