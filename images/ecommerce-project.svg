<svg width="350" height="200" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="350" height="200" fill="url(#bgGradient)"/>
  
  <!-- Shopping Cart Icon -->
  <g transform="translate(175, 100)">
    <!-- Cart body -->
    <rect x="-30" y="-15" width="50" height="25" rx="3" fill="none" stroke="white" stroke-width="3"/>
    <!-- Cart handle -->
    <path d="M-35,-15 L-40,-25 L-45,-25" fill="none" stroke="white" stroke-width="3"/>
    <!-- Cart wheels -->
    <circle cx="-20" cy="20" r="5" fill="white"/>
    <circle cx="10" cy="20" r="5" fill="white"/>
    <!-- Items in cart -->
    <rect x="-25" y="-10" width="8" height="15" fill="white" opacity="0.8"/>
    <rect x="-12" y="-10" width="8" height="15" fill="white" opacity="0.8"/>
    <rect x="1" y="-10" width="8" height="15" fill="white" opacity="0.8"/>
  </g>
  
  <!-- Title -->
  <text x="175" y="160" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">E-commerce</text>
</svg>