<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffed4e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="url(#bgGradient)"/>
  
  <!-- Web Browser Window -->
  <g transform="translate(200, 125)">
    <!-- Browser window -->
    <rect x="-80" y="-50" width="160" height="100" rx="8" fill="none" stroke="url(#iconGradient)" stroke-width="3"/>
    
    <!-- Browser header -->
    <rect x="-80" y="-50" width="160" height="20" rx="8" fill="url(#iconGradient)" opacity="0.3"/>
    
    <!-- Browser buttons -->
    <circle cx="-65" cy="-40" r="3" fill="url(#iconGradient)"/>
    <circle cx="-55" cy="-40" r="3" fill="url(#iconGradient)"/>
    <circle cx="-45" cy="-40" r="3" fill="url(#iconGradient)"/>
    
    <!-- Code elements -->
    <rect x="-70" y="-20" width="40" height="8" fill="url(#iconGradient)" opacity="0.7"/>
    <rect x="-70" y="-5" width="60" height="8" fill="url(#iconGradient)" opacity="0.7"/>
    <rect x="-70" y="10" width="50" height="8" fill="url(#iconGradient)" opacity="0.7"/>
    <rect x="-70" y="25" width="35" height="8" fill="url(#iconGradient)" opacity="0.7"/>
    
    <!-- Responsive design indicators -->
    <rect x="20" y="-35" width="25" height="40" rx="3" fill="none" stroke="url(#iconGradient)" stroke-width="2"/>
    <rect x="50" y="-25" width="15" height="25" rx="2" fill="none" stroke="url(#iconGradient)" stroke-width="2"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="200" text-anchor="middle" fill="#ffd700" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Web Project</text>
</svg>